<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" fill="none">
  <!-- Minimalist Flat Ticket Emblem (No Gradients) -->
  <g transform="translate(10, 12)">
    <!-- Base Ticket Contour with Lateral Precision Notches -->
    <path d="
      M 8,0
      H 52
      A 8,8 0 0,1 60,8
      V 22
      A 6,6 0 0,0 60,34
      V 48
      A 8,8 0 0,1 52,56
      H 8
      A 8,8 0 0,1 0,48
      V 34
      A 6,6 0 0,0 0,22
      V 8
      A 8,8 0 0,1 8,0
      Z"
      fill="#047857" />

    <!-- Perforation Line -->
    <line x1="20" y1="8" x2="20" y2="48" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,3" opacity="0.45" />

    <!-- Clean Tech Symbol (< / >) -->
    <path d="M 33 22 L 27 28 L 33 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 47 22 L 53 28 L 47 34" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="42" y1="20" x2="38" y2="36" stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" />

    <!-- Punch Hole Dot -->
    <circle cx="10" cy="28" r="2.5" fill="#ffffff" opacity="0.75" />
  </g>

  <!-- Clean Typography -->
  <g transform="translate(82, 44)">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">
      <tspan fill="#0f172a">Open</tspan><tspan fill="#059669">Ticket</tspan>
    </text>
  </g>

  <!-- Tagline Pill Badge -->
  <g transform="translate(84, 52)">
    <rect x="0" y="0" width="105" height="16" rx="4" fill="#ecfdf5" />
    <text x="7" y="11.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="700" fill="#047857" letter-spacing="1">GESTIÓN & SOPORTE</text>
  </g>
</svg>
