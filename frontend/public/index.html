<!DOCTYPE html>
<html lang="es" class="h-full bg-white dark:bg-zinc-950">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>favicon.svg">
    <link rel="alternate icon" type="image/x-icon" href="<%= BASE_URL %>favicon.ico">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>favicon.svg">
    <title>OpenTicket | Sistema de Gestión de Tickets</title>

    <!-- Fuente Inter de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Script de inicialización de Tema (evita parpadeo) -->
    <script>
      if (localStorage.getItem('openticket_theme') === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>

    <!-- Tailwind CSS (sin degradados, estilo SaaS empresarial con soporte Dark Mode y acentos verdes sobrios) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              brand: {
                50: '#ecfdf5',
                100: '#d1fae5',
                200: '#a7f3d0',
                300: '#6ee7b7',
                400: '#34d399',
                500: '#10b981',
                600: '#059669', // Verde equilibrado y elegante
                700: '#047857', // Verde corporativo principal
                800: '#065f46', // Verde institucional sobrio (no chillón)
                900: '#064e3b',
                950: '#022c22',
              }
            }
          }
        }
      }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="h-full font-sans text-slate-800 dark:text-zinc-100 antialiased bg-white dark:bg-zinc-950 selection:bg-brand-100 dark:selection:bg-brand-900 selection:text-brand-900 dark:selection:text-brand-100">
    <noscript>
      <strong>OpenTicket requiere JavaScript para funcionar.</strong>
    </noscript>
    <div id="app" class="h-full"></div>
  </body>
</html>
